[project]
name = "plant-disease-detector-api"
version = "1.0.0"
description = "API Flask que sirve modelos de detección de enfermedades foliares (banano, arroz y café)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
