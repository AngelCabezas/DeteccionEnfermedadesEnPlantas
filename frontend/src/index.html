<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Plant Disease Detector IA</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Detecta enfermedades en hojas de banano, arroz y café con inteligencia artificial a partir de una fotografía."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#14522f" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Plant Disease Detector IA" />

    <!-- Vista previa al compartir el enlace (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plant Disease Detector IA" />
    <meta property="og:title" content="Plant Disease Detector IA" />
    <meta
      property="og:description"
      content="Sube una foto de la hoja y descubre si está sana o qué enfermedad reconoce el modelo. Banano, arroz y café."
    />
    <meta property="og:image" content="img/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="256x256" href="img/logo-256.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Pantalla de carga mínima mientras arranca la aplicación -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #eef3ef;
        color: #3c4a42;
        font:
          500 0.95rem/1.5 Poppins,
          system-ui,
          sans-serif;
        z-index: 9999;
      }
      .app-splash__inner {
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      .app-splash img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
      }
      .app-splash__bar {
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: #d4ddd7;
        overflow: hidden;
      }
      .app-splash__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #1f7a3a;
        border-radius: inherit;
        animation: app-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash" role="status" aria-live="polite">
        <div class="app-splash__inner">
          <img src="img/logo.svg" alt="" />
          <div class="app-splash__bar" aria-hidden="true"></div>
          <span>Cargando Plant Disease Detector IA…</span>
        </div>
      </div>
    </app-root>
  </body>
</html>
